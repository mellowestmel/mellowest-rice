
# General behavior
general {
    hide_cursor = true
    ignore_empty_input = false
    fail_timeout = 2000
}

# Background
background {
    monitor =

    color = rgb(060606)
}

# Clock: hours
label {
    monitor =
    text = cmd[update:1000] date +"%H"

    color = rgb(e8e8e8)

    font_size = 100
    font_family = Lato

    position = 0, 160

    halign = center
    valign = center
}

# Clock: minutes
label {
    monitor =
    text = cmd[update:1000] date +"%M"

    color = rgb(e8e8e8)

    font_size = 100
    font_family = Lato

    position = 0, 40

    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"

    color = rgb(aaaaaa)

    font_size = 14
    font_family = Lato

    position = 0, -40

    halign = center
    valign = center
}

# Username
label {
    monitor =
    text = $USER

    font_size = 16
    font_family = Lato

    position = 0, -85

    halign = center
    valign = center
}

# Caps Lock status
label {
    monitor =
    text = cmd[update:500] ~/.local/share/scripts/checkCapslock.sh

    color = rgb(e4e78c)

    font_size = 12
    font_family = Lato

    position = 0, -165

    halign = center
    valign = center
}

# Password input field
input-field {
    monitor =

    size = 280, 42
    outline_thickness = 1
    rounding = 0

    outer_color = rgb(e4e78c)
    inner_color = rgb(181818)
    font_color = rgb(e8e8e8)

    check_color = rgb(e4e78c)
    fail_color = rgb(e4e78c)

    placeholder_text = 
    fail_text = Authentication failed

    fade_on_empty = false
    hide_input = false
    dots_text_format = *
    dots_center = true

    position = 0, -130

    halign = center
    valign = center
}

# Disable animations
animations {
    enabled = false
}